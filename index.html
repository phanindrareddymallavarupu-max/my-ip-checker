<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IP Sender</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 80px;
            background-color: #f4f4f9;
        }
        h1 { color: #333; }
        #status {
            font-size: 1.2rem;
            color: #0066cc;
            margin-top: 20px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <h1>Connecting...</h1>
    <div id="status">Fetching and sending your phone's IP address...</div>

    <script>
        async function sendIPToSystem() {
            const statusDiv = document.getElementById('status');
            try {
                // 1. Get the phone's public IP
                let ipResponse = await fetch('https://api.ipify.org?format=json');
                let ipData = await ipResponse.json();
                let phoneIp = ipData.ip;

                // 2. Send this IP to your system using YOUR specific ngrok link
                let backendUrl = 'https://trophy-appetizer-spleen.ngrok-free.dev/log-ip';

                let sendResponse = await fetch(backendUrl, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'ngrok-skip-browser-warning': 'true' 
                    },
                    body: JSON.stringify({ ip: phoneIp })
                });

                if (sendResponse.ok) {
                    statusDiv.innerText = "Success! Your phone's IP has been sent to your system.";
                } else {
                    statusDiv.innerText = "Failed to transmit IP to system.";
                }
            } catch (error) {
                statusDiv.innerText = "An error occurred during transmission.";
            }
        }

        // Automatically trigger as soon as the link is opened
        window.onload = sendIPToSystem;
    </script>

</body>
</html>
